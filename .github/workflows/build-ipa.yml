name: Build iOS IPA
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone
        run: xcodebuild -project FlightDeck.xcodeproj -scheme FlightDeck -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FlightDeck.app Payload/
          zip -r FlightDeck.ipa Payload
          rm -rf Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightDeck-IPA
          path: FlightDeck.ipa
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" FlightDeck.ipa --title "FlightDeck ${GITHUB_REF_NAME}" --generate-notes
