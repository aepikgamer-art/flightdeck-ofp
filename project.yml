name: FlightDeck
options:
  bundleIdPrefix: com.khyrie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  FlightDeck:
    type: application
    platform: iOS
    sources:
      - path: FlightDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khyrie.flightdeck
        PRODUCT_NAME: FlightDeck
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_CFBundleDisplayName: FlightDeck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO






