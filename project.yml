name: FlightDeck
options:
  bundleIdPrefix: com.khyrie
  deploymentTarget:
    iOS: "17.0"
sources:
  - path: FlightDeck
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.khyrie.flightdeck
    PRODUCT_NAME: FlightDeck
    SWIFT_VERSION: "5.0"
